/*
 * Project dependencies for the Cleanroom/Unimined build.
 *
 * Place locally built mod jars in libs/. The mandatory development mods are selected by ae2_supergiant_jar,
 * gregtech_jar and structurelib_jar in gradle.properties.
 */

repositories {
    flatDir {
        dirs('libs')
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
    mavenCentral()
    mavenLocal()
    maven {
        url = 'https://www.jitpack.io'
    }
}

def requiredLocalJar = { String propertyName ->
    def jarName = project.findProperty(propertyName)?.toString()
    if (jarName == null || jarName.trim().isEmpty()) {
        throw new GradleException("Property ${propertyName} must name a jar in libs/")
    }

    def jarFile = file("libs/${jarName}")
    if (!jarFile.isFile()) {
        throw new GradleException("Required local development dependency is missing: ${jarFile}")
    }
    return jarFile
}

def ae2SupergiantJar = requiredLocalJar('ae2_supergiant_jar')
def gregTechJar = requiredLocalJar('gregtech_jar')
def structureLibJar = requiredLocalJar('structurelib_jar')
def localArtifactName = { File jarFile -> jarFile.name.replaceFirst(/\.jar$/, '') }
def ae2SupergiantArtifact = localArtifactName(ae2SupergiantJar)
def gregTechArtifact = localArtifactName(gregTechJar)
def structureLibArtifact = localArtifactName(structureLibJar)

def localJarFingerprint = { File jarFile ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    jarFile.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int bytesRead
        while ((bytesRead = input.read(buffer)) != -1) {
            digest.update(buffer, 0, bytesRead)
        }
    }
    return digest.digest().encodeHex().toString()
}

// Unimined keys flatDir remap outputs by artifact name, so replacing a fixed-name jar can leave
// an old mapped jar in place. Track the input content separately and invalidate only that output.
def gregTechFingerprint = localJarFingerprint(gregTechJar)
def gregTechFingerprintFile = file(".gradle/applygray/local-mod-cache/${gregTechArtifact}.sha256")
def previousGregTechFingerprint = gregTechFingerprintFile.isFile() ?
        gregTechFingerprintFile.getText('UTF-8').trim() : null

if (previousGregTechFingerprint != gregTechFingerprint) {
    def modTransformDirectory = file('.gradle/unimined/local/modTransform')
    def mappedArtifactPrefix = "${gregTechArtifact}-mapped-"
    def invalidatedArtifacts = []

    if (modTransformDirectory.isDirectory()) {
        modTransformDirectory.eachFile { File candidate ->
            if (candidate.isFile() && candidate.name.startsWith(mappedArtifactPrefix) &&
                    candidate.name.endsWith('.jar')) {
                if (!candidate.delete()) {
                    throw new GradleException("Could not invalidate stale GregTech remap cache: ${candidate}")
                }
                invalidatedArtifacts.add(candidate.name)
            }
        }
    }

    gregTechFingerprintFile.parentFile.mkdirs()
    gregTechFingerprintFile.setText("${gregTechFingerprint}${System.lineSeparator()}", 'UTF-8')
    if (!invalidatedArtifacts.isEmpty()) {
        logger.lifecycle("GregTech jar content changed; invalidated ${invalidatedArtifacts.size()} cached " +
                "Unimined remap artifact(s).")
    }
}

// StructureLib is rebuilt far more often than GregTech, so its cached remap output is invalidated the same way.
// The match is by artifact name, which covers both the flat `-mapped-*.jar` layout and the per-artifact
// directory layout newer Unimined versions use.
def structureLibFingerprint = localJarFingerprint(structureLibJar)
def structureLibFingerprintFile = file(".gradle/applygray/local-mod-cache/${structureLibArtifact}.sha256")
def previousStructureLibFingerprint = structureLibFingerprintFile.isFile() ?
        structureLibFingerprintFile.getText('UTF-8').trim() : null

if (previousStructureLibFingerprint != structureLibFingerprint) {
    def modTransformDirectory = file('.gradle/unimined/local/modTransform')
    def stale = []
    if (modTransformDirectory.isDirectory()) {
        modTransformDirectory.eachFileRecurse { File candidate ->
            if (candidate.name.toLowerCase().contains(structureLibArtifact.toLowerCase())) stale.add(candidate)
        }
    }
    def invalidated = 0
    stale.sort { a, b -> b.path.length() <=> a.path.length() }.each { File candidate ->
        if (candidate.exists() && (candidate.isDirectory() ? candidate.deleteDir() : candidate.delete())) {
            invalidated++
        }
    }

    structureLibFingerprintFile.parentFile.mkdirs()
    structureLibFingerprintFile.setText("${structureLibFingerprint}${System.lineSeparator()}", 'UTF-8')
    if (invalidated > 0) {
        logger.lifecycle("StructureLib jar content changed; invalidated ${invalidated} cached Unimined remap " +
                "artifact(s).")
    }
}

// One line per build makes the selected local artifacts clear without runtime log noise.
logger.lifecycle("Using Applied Energistics 2 Supergiant dependency: ${ae2SupergiantJar.name}")
logger.lifecycle("Using GregTech development dependency: ${gregTechJar.name}")
logger.lifecycle("Using StructureLib development dependency: ${structureLibJar.name}")

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'com.cleanroommc:sponge-mixin:0.20.12+mixin.0.8.7'
    compileOnly 'com.cleanroommc:lwjglx:1.0.0'
    // GregTech's public Material API carries ZenScript annotations.
    compileOnly 'CraftTweaker2:ZenScript:4.1.20.700'

    // Mandatory local development mods. Resolve them from libs/ as named artifacts so Unimined remaps them.
    modCompileOnly(name: ae2SupergiantArtifact)
    modRuntimeOnly(name: ae2SupergiantArtifact)
    modCompileOnly(name: gregTechArtifact)
    modRuntimeOnly(name: gregTechArtifact)

    // GuiCraftAmount directly inherits AE2's optional Mouse Tweaks integration interface.
    // Keep this compile-only, matching AE2's optional runtime dependency.
    modCompileOnly 'curse.maven:mouse-tweaks-unofficial-461660:5876158'

    // APIs used by ApplyGray's integration code.
    modCompileOnly('com.cleanroommc:modularui:3.1.6') {
        transitive = false
    }
    modRuntimeOnly('com.cleanroommc:modularui:3.1.6') {
        transitive = false
    }
    modCompileOnly('com.cleanroommc:groovyscript:1.4.3') {
        transitive = false
    }
    modRuntimeOnly('com.cleanroommc:groovyscript:1.4.3') {
        transitive = false
    }
    modCompileOnly 'mezz:jei:4.31.2'
    modRuntimeOnly 'mezz:jei:4.31.2'
    modCompileOnly 'curse.maven:the-one-probe-245211:2667280'
    modRuntimeOnly 'curse.maven:the-one-probe-245211:2667280'
    modCompileOnly 'curse.maven:codechicken-lib-1-8-242818:2779848'
    modRuntimeOnly 'curse.maven:codechicken-lib-1-8-242818:2779848'
    // Fugue supplies Java 25 compatibility patches for legacy CodeChickenLib.
    modRuntimeOnly 'curse.maven:fugue-1005815:7853971'
    // GregTech exposes EnderCore API types from its public classes, so they are
    // needed on this addon's compilation classpath. Do not load EnderCore in the
    // Java 25 development client: its legacy transformer cannot process Cleanroom's
    // patched Minecraft classes.
    modCompileOnly("com.enderio.core:EnderCore:1.12.2-0.5.78:core")
    modCompileOnly("com.enderio.core:EnderCore:1.12.2-0.5.78")

    // StructureLib owns the structure engine (capture, planning, build transactions) and the AE2/GT adapters.
    // It is consumed exactly like GregTech or AE2: a jar in libs/, selected by structurelib_jar in
    // gradle.properties. StructureLib's own `gradlew syncDownstreamLibs` refreshes this jar.
    modCompileOnly(name: structureLibArtifact)
    modRuntimeOnly(name: structureLibArtifact)

    if (project.findProperty('enable_junit_testing')?.toString()?.toBoolean()) {
        testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
