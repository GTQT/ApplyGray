# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = true
enable_junit_testing = false
show_testing_output = false
enable_shadow = false
enable_lwjglx = true

# Mod Information
mod_version = 1.0.0
root_package = applygray
mod_id = applygray
mod_name = ApplyGray
mod_description = Applied Energistics 2 Supergiant integration addon for GregTech.
mod_url =
mod_update_json =
mod_authors =
mod_credits =
mod_license = All Rights Reserved

# Local development dependencies
ae2_supergiant_jar = AppliedEnergistics2-Supergiant.jar
gregtech_jar = gregtech-gtqt-1.12.2-1.9.0.jar

# Run Configuration
minecraft_username = ApplyGrayDev
extra_jvm_args =
enable_foundation_debug = false

# Publishing metadata retained for the shared build configuration.
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =
maven_group = ${root_package}
maven_artifact_id = ${mod_id}

# Cleanroom settings
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = applygray.mixins.ApplyGrayMixinLoadingPlugin
